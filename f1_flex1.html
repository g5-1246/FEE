<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAYOUT-8</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    background-color:#222;
}

.container{
    width:100%;
    min-height:100vh;
    border:2px solid black;
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.row{
    display:flex;
    justify-content:center;
    gap:20px;
    width:100%;
}

.box{
    width:180px;
    height:100px;
    background:#7ec8ff;
    border-radius:10px;
}

@media (max-width:768px){

    .container{
        width:100%;
        min-height:100vh;
        padding:20px;
    }

    .row{
        flex-direction:column;
        align-items:center;
    }

    .box{
        width:90%;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="row">
        <div class="box"></div>
    </div>
    
    <div class="row">
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="row">
        <div class="box"></div>
    </div>

</div>

</body>
</html>
