<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>f12_navbar</title>
      <style>
        *{
            margin:0px ;
            padding:0px ;
            box-sizing:border-box ;
            font-size:1.2rem ;
            color: white;
        }
        body{
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <header style="padding: 10px;
                   height: 10vh;
                   background-color: dodgerblue;
                   display: flex;
                   align-items: center;">
    <nav>
    Navigation Links
    </nav>
    </header>
    <section style="display: flex;
                    justify-content: space-between;">
    <aside style="padding: 10px;
                  height: 80vh;
                  width: 20%;
                  background-color: indigo;">
    Sidebar
    </aside>
    <main style="padding: 10px;
                 height: 80vh;
                 width: 65%;
                 background-color: teal;">
    Main           
    </main>
    <article style="padding: 10px;
                    height: 80vh;
                    width: 15%;
                    background-color: indigo;">
    Article
    </article>
    </section>
    <footer style="padding: 10px;
                   height: 10vh;
                   background-color: dodgerblue;">
    Footer
    </footer>
</body>
</html>
