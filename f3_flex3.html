<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>f3_flex3</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
        body{
            background-color: black;
            color:white;
            border:2px solid white;
            display: flex;
            flex-direction: column;
            height:100vh;
            font-family: Arial, Helvetica, sans-serif;
        }
        header,footer{
            display: flex;
            height:10%;
        }
        header div,footer div{
            flex:1;
            display: flex;
            padding:20px;
            background-color: black;
            color:white;
            border:2px solid white;
        }
        main{
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            border-left:2px solid white;
            border-right:2px solid white;
            background-color: black;
        }
        .box1,.box2{
            width:200px;
            height:150px;
            background-color: blue;
            border:1px solid white
        }
        .box2{
            margin-left: -100px;   
            margin-top:125px;
        }
    </style>
</head>
<body>
    <header>
        <div> Logo </div>
        <div> Links </div>
    </header>
    <main>
        <div class="box1"></div>
        <div class="box2"></div>
    </main>
    <footer>
        <div> Footer 1 </div>
        <div> Footer 2 </div>
    </footer>
</body>
</html>
