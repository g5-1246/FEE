<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>f4_flex4</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
        body{
            background-color: navy;
            font-family: 'Courier New', Courier, monospace;
            min-height: 80dvh;

        }
        .box{
            min-width:70dvh;
            padding: 15px;
            margin:15px;
            height: 20dvh;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circles{
            display: flex;
        }
        .circle{
            width: 100px;
            height: 100px;
            border: 3px solid black;
            border-radius: 50%;
            margin-left: -20px;
        }
        
        </style>
</head>
<body>
   <div class="box">
    <div class="circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</div>
</body>
</html>
